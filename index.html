<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JP Construções — Pedidos</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f4f2;
    color: #2c2c2a;
  }
  .container { max-width: 680px; margin: 0 auto; padding: 20px 16px 60px; }

  .header {
    display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 14px;
    border: 1px solid #e5e4df; padding: 14px 16px; margin-bottom: 16px;
  }
  .header img { width: 54px; height: 54px; object-fit: contain; border-radius: 8px; }
  .header .titulo { font-size: 17px; font-weight: 800; color: #1f1f1d; }
  .header .slogan { font-size: 11px; color: #d9631e; font-weight: 700; letter-spacing: 0.3px; }

  .backup-buttons { display: flex; gap: 6px; margin-left: auto; flex-shrink: 0; }
  .backup-buttons button, .backup-buttons label {
    font-size: 11px; font-weight: 600; padding: 6px 8px; border-radius: 8px; border: 1px solid #ddd;
    background: #fff; color: #555; cursor: pointer; white-space: nowrap;
  }
  .backup-msg { font-size: 12px; color: #1e7b34; margin-bottom: 10px; min-height: 14px; }
  .backup-msg.erro { color: #b3261e; }

  .resumo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .resumo .card {
    background: #fff; border-radius: 12px; border: 1px solid #e5e4df; padding: 12px 14px;
  }
  .resumo .card .label { font-size: 11px; color: #777; margin-bottom: 3px; }
  .resumo .card .value { font-size: 16px; font-weight: 700; }
  .value.orange { color: #d9631e; }
  .value.green { color: #1e7b34; }
  .value.red { color: #b3261e; }
  .value.blue { color: #235a9e; }

  .tabs { display: flex; gap: 6px; margin-bottom: 16px; background: #fff; border: 1px solid #e5e4df;
    border-radius: 12px; padding: 4px; overflow-x: auto; }
  .tabs button {
    flex: 1; min-width: 90px; padding: 9px 4px; border-radius: 9px; border: none; background: transparent;
    font-size: 11.5px; font-weight: 700; cursor: pointer; color: #777; white-space: nowrap;
  }
  .tabs button.active { background: #d9631e; color: #fff; }

  form.item-form {
    background: #fff; border-radius: 12px; border: 1px solid #e5e4df; padding: 16px;
    margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 140px; }
  label { display: block; font-size: 12px; color: #666; margin-bottom: 3px; }
  input, select {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #ddd;
    font-size: 14px; background: #fff; font-family: inherit;
  }
  input:focus, select:focus { outline: none; border-color: #d9631e; }

  .error { font-size: 12px; color: #b3261e; }
  .hint { font-size: 12.5px; color: #a05a00; background: #fdf7ec; border: 1px solid #f0d9a8; border-radius: 8px; padding: 8px 10px; }

  .itens-box { background: #f7f6f2; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .btn-add-item {
    background: #235a9e; color: #fff; border: none; padding: 9px; border-radius: 8px;
    font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .btn-add-item:hover { background: #1c4a82; }
  .item-linha {
    display: flex; justify-content: space-between; align-items: center; background: #fff;
    border: 1px solid #e5e4df; border-radius: 8px; padding: 8px 10px; font-size: 13px;
  }
  .item-linha .item-desc { flex: 1; }
  .item-linha .item-sub { font-weight: 700; margin-right: 8px; white-space: nowrap; }

  .periodo-toggle { display: flex; gap: 6px; }
  .periodo-toggle button {
    flex: 1; padding: 8px; border-radius: 8px; border: 1px solid #ddd; background: #fff;
    font-size: 12.5px; font-weight: 700; cursor: pointer; color: #666;
  }
  .periodo-toggle button.active { background: #d9631e; color: #fff; border-color: #d9631e; }

  .total-box {
    background: #fdf7ec; border: 1px solid #f0d9a8; border-radius: 10px; padding: 10px 12px;
    font-size: 13px; color: #555; display: flex; flex-direction: column; gap: 3px;
  }
  .total-box .total-geral { font-size: 16px; font-weight: 800; color: #a05a00; margin-top: 4px; }

  .entrega-destaque {
    background: #eef5fc; border: 1px solid #c9dff2; border-radius: 10px; padding: 10px 12px 4px;
  }
  .entrega-destaque label { color: #2b6cb0; }

  button.submit {
    background: #d9631e; color: #fff; border: none; padding: 10px; border-radius: 8px;
    font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 4px;
  }
  button.submit:hover { background: #c1551a; }
  button.submit.fin { background: #1e7b34; }
  button.submit.fin:hover { background: #226b39; }

  .pedido-card {
    background: #fff; border-radius: 12px; border: 1px solid #e5e4df; padding: 14px;
    margin-bottom: 10px;
  }
  .pedido-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .pedido-cliente { font-size: 15px; font-weight: 700; }
  .pedido-valor { font-size: 15px; font-weight: 700; color: #1e7b34; white-space: nowrap; }
  .pedido-info { font-size: 12.5px; color: #666; margin-top: 6px; line-height: 1.6; }
  .pedido-info b { color: #444; }
  .pedido-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn-avancar {
    background: #235a9e; color: #fff; border: none; padding: 8px 14px; border-radius: 8px;
    font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  .btn-avancar:hover { background: #1c4a82; }
  .btn-voltar {
    background: #fff; color: #888; border: 1px solid #ddd; padding: 8px 14px; border-radius: 8px;
    font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .btn-imprimir {
    background: #fff; color: #d9631e; border: 1px solid #f0c9a8; padding: 8px 14px; border-radius: 8px;
    font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  .btn-imprimir:hover { background: #fdf0e4; }
  .del-btn {
    background: none; border: none; color: #ccc; cursor: pointer; padding: 4px; flex-shrink: 0; font-size: 15px;
  }
  .del-btn:hover { color: #b3261e; }

  .badge { font-size: 10px; padding: 2px 8px; border-radius: 999px; font-weight: 700; display: inline-block; margin-top: 4px; }
  .badge.orcamento { background: #f0eee7; color: #776f5f; }
  .badge.aprovado { background: #e0edfb; color: #235a9e; }
  .badge.entrega { background: #fdf0da; color: #a05a00; }
  .badge.executado { background: #dcf3e2; color: #1e7b34; }

  /* financeiro (comissao / pagamento) */
  .fin-item {
    background: #fff; border-radius: 12px; border: 1px solid #e5e4df; padding: 12px 14px;
    margin-bottom: 8px; display: flex; gap: 10px; align-items: flex-start;
  }
  .fin-item.pago { border-color: #b9dcc0; background: #f2faf4; opacity: 0.85; }
  .checkbox {
    width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #ccc; background: #fff;
    flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: transparent; font-size: 13px; margin-top: 2px;
  }
  .checkbox.checked { background: #2f9e52; border-color: #2f9e52; color: #fff; }
  .fin-body { flex: 1; min-width: 0; }
  .fin-title { font-size: 14px; font-weight: 700; }
  .fin-title.strike { text-decoration: line-through; color: #999; }
  .fin-meta { font-size: 12px; color: #777; margin-top: 3px; }

  .empty { text-align: center; color: #999; font-size: 13px; padding: 40px 0; }

  .pedido-pendente-banner, .pedido-pago-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 12.5px; font-weight: 700; padding: 7px 10px; border-radius: 7px; margin-bottom: 10px;
  }
  .pedido-pendente-banner { background: #fdeceb; color: #c0392b; }
  .pedido-pago-banner { background: #eafaf0; color: #2f9e52; }
  .pedido-pendente-banner button, .pedido-pago-banner button {
    border: none; border-radius: 5px; padding: 5px 9px; font-size: 11.5px; font-weight: 700; cursor: pointer; color: #fff;
  }
  .pedido-pendente-banner button { background: #c0392b; }
  .pedido-pago-banner button { background: #2f9e52; }

  /* comprovante para gerar imagem */
  #reciboTemplate {
    position: fixed; left: -9999px; top: 0; width: 420px; background: #fff; padding: 24px;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #222;
  }
  .rc-header { display: flex; align-items: center; gap: 12px; border-bottom: 2px solid #d9631e; padding-bottom: 12px; margin-bottom: 14px; }
  .rc-header img { width: 50px; height: 50px; object-fit: contain; }
  .rc-header .rc-nome { font-size: 16px; font-weight: 800; }
  .rc-header .rc-slogan { font-size: 10px; color: #d9631e; font-weight: 700; }
  .rc-titulo { font-size: 14px; font-weight: 800; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  .rc-linha { font-size: 13px; margin-bottom: 6px; line-height: 1.5; }
  .rc-linha b { color: #444; }
  .rc-valor-box { background: #fdf7ec; border: 1px solid #f0d9a8; border-radius: 8px; padding: 10px 12px; margin: 12px 0; }
  .rc-valor-box .rc-valor-total { font-size: 20px; font-weight: 800; color: #d9631e; }
  .rc-rodape { font-size: 10.5px; color: #999; margin-top: 16px; border-top: 1px solid #eee; padding-top: 8px; }
  .rc-tabela { width: 100%; border-collapse: collapse; margin: 10px 0 14px; }
  .rc-tabela th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 0.3px; color: #999; border-bottom: 1.5px solid #eee; padding: 4px 3px 6px; }
  .rc-tabela th.num, .rc-tabela td.num { text-align: right; }
  .rc-tabela td { font-size: 12.5px; padding: 7px 3px; border-bottom: 1px solid #f2f2f2; vertical-align: top; }
  .rc-tabela td.desc { font-weight: 600; }
  .rc-tabela td.sub { font-weight: 700; white-space: nowrap; }
  .rc-badge-parcelado { display: inline-block; background: #fdf1e4; color: #d9631e; font-size: 10.5px; font-weight: 800; padding: 2px 9px; border-radius: 20px; margin-left: 6px; vertical-align: middle; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<div class="container">

  <div class="header">
    <img id="logoImg" alt="Logo JP Construções">
    <div>
      <div class="titulo">JP CONSTRUÇÕES</div>
      <div class="slogan">A MELHOR DO BRASIL</div>
    </div>
    <div class="backup-buttons">
      <button id="btnExportar" title="Exportar backup">⬇ Exportar</button>
      <label for="inputImportar" id="btnImportar" title="Importar backup">⬆ Importar</label>
      <input type="file" id="inputImportar" accept="application/json" style="display:none;">
    </div>
  </div>
  <div class="backup-msg" id="backupMsg"></div>

  <div class="resumo">
    <div class="card">
      <div class="label">Orçamentos em aberto</div>
      <div class="value orange" id="resOrcamentos">0</div>
    </div>
    <div class="card">
      <div class="label">Pedidos em andamento</div>
      <div class="value blue" id="resAndamento">0</div>
    </div>
    <div class="card">
      <div class="label">Comissão a receber</div>
      <div class="value green" id="resComissao">R$ 0,00</div>
    </div>
    <div class="card">
      <div class="label">Marketing no mês</div>
      <div class="value red" id="resPagamentos">R$ 0,00</div>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button data-aba="orcamento" class="active">Criar orçamento</button>
    <button data-aba="aprovado">Aprovados</button>
    <button data-aba="entrega">Em entrega</button>
    <button data-aba="executado">Executados</button>
    <button data-aba="comissao">Comissão</button>
    <button data-aba="pagamento">Marketing</button>
    <button data-aba="produtos">Produtos</button>
    <button data-aba="frete">Frete</button>
  </div>

  <!-- FORM ORÇAMENTO -->
  <form class="item-form" id="formOrcamento">
    <div class="row entrega-destaque">
      <div>
        <label>📅 Data prevista de entrega</label>
        <input type="date" id="opDataEntrega">
      </div>
      <div>
        <label>Período</label>
        <div class="periodo-toggle">
          <button type="button" data-periodo="manha" id="btnPeriodoManha">☀️ Manhã</button>
          <button type="button" data-periodo="tarde" id="btnPeriodoTarde">🌇 Tarde</button>
        </div>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Nome do cliente</label>
        <input type="text" id="opCliente" placeholder="Ex: José da Silva">
      </div>
      <div>
        <label>Telefone</label>
        <input type="text" id="opTelefone" placeholder="Ex: (41) 99999-9999">
      </div>
    </div>

    <div>
      <label>Endereço de entrega</label>
      <input type="text" id="opEndereco" placeholder="Rua, número, bairro, cidade">
    </div>
    <div class="row">
      <div>
        <label>Bairro</label>
        <input type="text" id="opBairro" placeholder="Ex: Centro">
      </div>
      <div>
        <label>Número do imóvel</label>
        <input type="text" id="opNumero" placeholder="Ex: 123">
      </div>
    </div>
    <div>
      <label>Ponto de referência</label>
      <input type="text" id="opReferencia" placeholder="Ex: perto do mercado, portão azul">
    </div>

    <div class="itens-box">
      <label style="margin-bottom:6px;">Produtos do orçamento</label>
      <div class="row">
        <div>
          <label>Produto</label>
          <select id="opSelectProduto">
            <option value="">Selecione um produto...</option>
          </select>
        </div>
        <div>
          <label>Quantidade</label>
          <input type="number" min="1" id="opItemQtd" placeholder="Ex: 50">
        </div>
        <div>
          <label>Preço unitário (R$)</label>
          <input type="text" inputmode="decimal" id="opItemPreco" placeholder="Ex: 55,00">
        </div>
      </div>
      <button type="button" class="btn-add-item" id="btnAddItem">+ Adicionar item ao orçamento</button>
      <div class="error" id="erroItem"></div>
      <div id="itensAtuaisLista"></div>
    </div>

    <div class="row">
      <div>
        <label>Frete</label>
        <select id="opSelectFrete">
          <option value="">Sem frete</option>
        </select>
      </div>
      <div>
        <label>Valor do frete (R$)</label>
        <input type="text" inputmode="decimal" id="opFreteValor" placeholder="Ex: 50,00" value="0">
      </div>
    </div>

    <div>
      <label>Observação para o motorista</label>
      <input type="text" id="opObsMotorista" placeholder="Ex: entregar pela manhã, ligar antes de chegar">
    </div>

    <div>
      <label>Forma de pagamento</label>
      <select id="opPagamento">
        <option value="À vista">À vista</option>
        <option value="Pix">Pix</option>
        <option value="Cartão">Cartão</option>
        <option value="2x">2x sem juros</option>
        <option value="3x">3x sem juros</option>
        <option value="Parcelado com juros">Acima de 3x (com juros de 2% por parcela)</option>
      </select>
    </div>
    <div class="row" id="opParceladoJurosFields" style="display:none;">
      <div>
        <label>Quantidade de parcelas (4 ou mais)</label>
        <input type="number" min="4" id="opQtdParcelasJuros" placeholder="Ex: 6">
      </div>
    </div>
    <div class="hint" id="opParcelaPreview"></div>

    <div class="total-box">
      <div>Total dos produtos: <b id="totalProdutosPreview">R$ 0,00</b></div>
      <div>Frete: <b id="totalFretePreview">R$ 0,00</b></div>
      <div class="total-geral">Total geral: <span id="totalGeralPreview">R$ 0,00</span></div>
    </div>

    <div class="error" id="erroOrcamento"></div>
    <button type="submit" class="submit" id="btnSubmitOrcamento">Criar orçamento</button>
    <button type="button" class="submit" id="btnCancelarEdicao" style="display:none; background:#888; margin-top:8px;">Cancelar edição</button>
  </form>

  <!-- FORM PRODUTOS -->
  <form class="item-form" id="formProduto" style="display:none;">
    <div class="row">
      <div>
        <label>Nome do produto</label>
        <input type="text" id="prodNome" placeholder="Ex: Telha fibrocimento 2,44x1,10">
      </div>
      <div>
        <label>Preço de venda (R$)</label>
        <input type="text" inputmode="decimal" id="prodPreco" placeholder="Ex: 55,00">
      </div>
    </div>
    <div>
      <label>Preço de custo (R$) — não aparece pro cliente</label>
      <input type="text" inputmode="decimal" id="prodCusto" placeholder="Ex: 40,00">
    </div>
    <div class="error" id="erroProduto"></div>
    <button type="submit" class="submit" id="btnSubmitProduto">Cadastrar produto</button>
    <button type="button" class="submit" id="btnCancelarEdicaoProduto" style="display:none; background:#888; margin-top:8px;">Cancelar edição</button>
  </form>

  <!-- FORM FRETE -->
  <form class="item-form" id="formFrete" style="display:none;">
    <div class="row">
      <div>
        <label>Local / faixa de entrega</label>
        <input type="text" id="freteLocal" placeholder="Ex: Centro, até 10km, zona rural">
      </div>
      <div>
        <label>Valor cobrado do cliente (R$)</label>
        <input type="text" inputmode="decimal" id="fretePreco" placeholder="Ex: 50,00">
      </div>
    </div>
    <div>
      <label>Custo do frete (R$) — não aparece pro cliente</label>
      <input type="text" inputmode="decimal" id="freteCustoInput" placeholder="Ex: 30,00">
    </div>
    <div class="error" id="erroFrete"></div>
    <button type="submit" class="submit" id="btnSubmitFrete">Cadastrar frete</button>
    <button type="button" class="submit" id="btnCancelarEdicaoFrete" style="display:none; background:#888; margin-top:8px;">Cancelar edição</button>
  </form>

  <!-- FORM COMISSÃO -->
  <form class="item-form" id="formComissao" style="display:none;">
    <div>
      <label>Descrição</label>
      <input type="text" id="comDescricao" placeholder="Ex: comissão pedido José da Silva">
    </div>
    <div class="row">
      <div>
        <label>Valor (R$)</label>
        <input type="text" inputmode="decimal" id="comValor" placeholder="Ex: 150,00">
      </div>
      <div>
        <label>Data</label>
        <input type="date" id="comData">
      </div>
    </div>
    <div class="error" id="erroComissao"></div>
    <button type="submit" class="submit fin">Adicionar comissão</button>
  </form>

  <!-- FORM PAGAMENTO DO MÊS -->
  <form class="item-form" id="formPagamento" style="display:none;">
    <div>
      <label>Descrição</label>
      <input type="text" id="pagDescricao" placeholder="Ex: anúncio Facebook, impulsionamento Instagram">
    </div>
    <div class="row">
      <div>
        <label>Valor (R$)</label>
        <input type="text" inputmode="decimal" id="pagValor" placeholder="Ex: 800,00">
      </div>
      <div>
        <label>Vencimento</label>
        <input type="date" id="pagVencimento">
      </div>
    </div>
    <div class="error" id="erroPagamento"></div>
    <button type="submit" class="submit fin">Adicionar gasto de marketing</button>
  </form>

  <div id="lista"></div>
  <div id="reciboTemplate"></div>

const STORAGE_KEY = 'jp_construcoes_dados';
let dados;
try {
  dados = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
} catch (e) {
  dados = {};
}
if (!Array.isArray(dados.pedidos)) dados.pedidos = [];
if (!Array.isArray(dados.comissoes)) dados.comissoes = [];
if (!Array.isArray(dados.pagamentos)) dados.pagamentos = [];
if (!Array.isArray(dados.produtos)) dados.produtos = [];
if (!Array.isArray(dados.fretes)) dados.fretes = [];
if (!Array.isArray(dados.pedidos)) dados.pedidos = [];
dados.pedidos.forEach(p => { if (!Array.isArray(p.itens)) p.itens = []; });

function testarStorage() {
  try {
    localStorage.setItem('__teste__', '1');
    localStorage.removeItem('__teste__');
    return true;
  } catch (e) {
    return false;
  }
}
if (!testarStorage()) {
  const aviso = document.createElement('div');
  aviso.style.cssText = 'background:#fbdcda;color:#b3261e;border:1px solid #e0958f;border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px;font-weight:600;';
  aviso.textContent = '⚠️ Este navegador está bloqueando o salvamento dos dados. Abra este arquivo direto no Chrome ou Safari (não dentro do WhatsApp, Instagram ou outro app com navegador embutido) para os dados salvarem corretamente.';
  document.querySelector('.container').insertBefore(aviso, document.querySelector('.resumo'));
}

const formFrete = document.getElementById('formFrete');
const erroOrcamento = document.getElementById('erroOrcamento');
const erroComissao = document.getElementById('erroComissao');
const erroPagamento = document.getElementById('erroPagamento');
const erroProduto = document.getElementById('erroProduto');
const erroFrete = document.getElementById('erroFrete');
const erroItem = document.getElementById('erroItem');

const opPagamento = document.getElementById('opPagamento');
const opParceladoJurosFields = document.getElementById('opParceladoJurosFields');
const opQtdParcelasJuros = document.getElementById('opQtdParcelasJuros');
const opParcelaPreview = document.getElementById('opParcelaPreview');
const opSelectProduto = document.getElementById('opSelectProduto');
const opItemQtd = document.getElementById('opItemQtd');
const opItemPreco = document.getElementById('opItemPreco');
const opSelectFrete = document.getElementById('opSelectFrete');
const opFreteValor = document.getElementById('opFreteValor');
let periodoSelecionado = null;

function popularSelectsOrcamento() {
  opSelectProduto.innerHTML = '<option value="">Selecione um produto...</option>' +
    dados.produtos.map(p => `<option value="${p.id}">${p.nome} — ${formatarMoeda(p.precoUnitario)}</option>`).join('');
  opSelectFrete.innerHTML = '<option value="">Sem frete</option>' +
    dados.fretes.map(f => `<option value="${f.id}">${f.local} — ${formatarMoeda(f.valor)}</option>`).join('');
}

opSelectProduto.addEventListener('change', () => {
  const p = dados.produtos.find(x => x.id === opSelectProduto.value);
  if (p) opItemPreco.value = String(p.precoUnitario).replace('.', ',');
});
opSelectFrete.addEventListener('change', () => {
  const f = dados.fretes.find(x => x.id === opSelectFrete.value);
  opFreteValor.value = f ? String(f.valor).replace('.', ',') : '0';
  calcularTotais();
});
opFreteValor.addEventListener('input', calcularTotais);

document.getElementById('btnAddItem').addEventListener('click', () => {
  erroItem.textContent = '';
  const produtoId = opSelectProduto.value;
  const produtoSelecionado = dados.produtos.find(p => p.id === produtoId);
  const nome = produtoSelecionado ? produtoSelecionado.nome : '';
  const custoUnitario = produtoSelecionado ? (produtoSelecionado.precoCusto || 0) : 0;
  const qtd = parseInt(opItemQtd.value);
  const preco = parseValor(opItemPreco.value);

  if (!nome) { erroItem.textContent = 'Selecione um produto.'; return; }
  if (!qtd || qtd <= 0) { erroItem.textContent = 'Informe a quantidade.'; return; }
  if (isNaN(preco) || preco <= 0) { erroItem.textContent = 'Informe o preço unitário.'; return; }

  itensAtuais.push({ nome, quantidade: qtd, precoUnitario: preco, custoUnitario, subtotal: qtd * preco });
  renderItensAtuais();
  opItemQtd.value = '';
  opItemPreco.value = '';
  opSelectProduto.value = '';
});

function renderItensAtuais() {
  const box = document.getElementById('itensAtuaisLista');
  box.innerHTML = itensAtuais.map((it, i) => `
    <div class="item-linha">
      <div class="item-desc">${it.nome} — ${it.quantidade} x ${formatarMoeda(it.precoUnitario)}</div>
      <div class="item-sub">${formatarMoeda(it.subtotal)}</div>
      <button type="button" class="del-btn" onclick="window.__removerItemAtual(${i})">✕</button>
    </div>
  `).join('');
  calcularTotais();
}

window.__removerItemAtual = function(i) {
  itensAtuais.splice(i, 1);
  renderItensAtuais();
};

function totalProdutosAtual() {
  return itensAtuais.reduce((acc, it) => acc + it.subtotal, 0);
}

function calcularComissaoPedido(p) {
  const lucroProdutos = (p.itens || []).reduce((acc, it) => acc + (it.quantidade * (it.precoUnitario - (it.custoUnitario || 0))), 0);
  const lucroFrete = (p.freteValor || 0) - (p.freteCusto || 0);
  return lucroProdutos + lucroFrete;
}

function calcularTotais() {
  const totalProdutos = totalProdutosAtual();
  const frete = parseValor(opFreteValor.value) || 0;
  const totalGeral = totalProdutos + frete;
  document.getElementById('totalProdutosPreview').textContent = formatarMoeda(totalProdutos);
  document.getElementById('totalFretePreview').textContent = formatarMoeda(frete);
  document.getElementById('totalGeralPreview').textContent = formatarMoeda(totalGeral);
  calcularParcelamento();
  return totalGeral;
}

document.getElementById('btnPeriodoManha').addEventListener('click', () => setPeriodo('manha'));
document.getElementById('btnPeriodoTarde').addEventListener('click', () => setPeriodo('tarde'));
function setPeriodo(p) {
  periodoSelecionado = periodoSelecionado === p ? null : p;
  document.getElementById('btnPeriodoManha').classList.toggle('active', periodoSelecionado === 'manha');
  document.getElementById('btnPeriodoTarde').classList.toggle('active', periodoSelecionado === 'tarde');
}

function calcularParcelamento() {
  const valor = totalProdutosAtual() + (parseValor(opFreteValor.value) || 0);
  const forma = opPagamento.value;

  if (isNaN(valor) || valor <= 0) {
    opParcelaPreview.textContent = '';
    return;
  }

  if (forma === '2x' || forma === '3x') {
    const qtd = forma === '2x' ? 2 : 3;
    opParcelaPreview.textContent = qtd + 'x de ' + formatarMoeda(valor / qtd) + ' (sem juros)';
  } else if (forma === 'Parcelado com juros') {
    const qtd = parseInt(opQtdParcelasJuros.value);
    if (!qtd || qtd < 4) {
      opParcelaPreview.textContent = 'Informe a quantidade de parcelas (4 ou mais).';
      return;
    }
    const valorComJuros = valor * (1 + 0.02 * qtd);
    const valorParcela = valorComJuros / qtd;
    opParcelaPreview.textContent =
      qtd + 'x de ' + formatarMoeda(valorParcela) + ' — total com juros: ' + formatarMoeda(valorComJuros);
  } else {
    opParcelaPreview.textContent = '';
  }
}

opPagamento.addEventListener('change', () => {
  opParceladoJurosFields.style.display = opPagamento.value === 'Parcelado com juros' ? 'flex' : 'none';
  calcularParcelamento();
});
opQtdParcelasJuros.addEventListener('input', calcularParcelamento);

document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-aba]');
  if (!btn) return;
  setAba(btn.dataset.aba);
});

function setAba(aba) {
  abaAtual = aba;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.aba === aba));

  formOrcamento.style.display = aba === 'orcamento' ? 'flex' : 'none';
  formComissao.style.display = aba === 'comissao' ? 'flex' : 'none';
  formPagamento.style.display = aba === 'pagamento' ? 'flex' : 'none';
  formProduto.style.display = aba === 'produtos' ? 'flex' : 'none';
  formFrete.style.display = aba === 'frete' ? 'flex' : 'none';

  erroOrcamento.textContent = '';
  erroComissao.textContent = '';
  erroPagamento.textContent = '';
  erroProduto.textContent = '';
  erroFrete.textContent = '';
  opParcelaPreview.textContent = '';
  if (aba !== 'produtos' && typeof sairModoEdicaoProduto === 'function') sairModoEdicaoProduto();
  if (aba !== 'frete' && typeof sairModoEdicaoFrete === 'function') sairModoEdicaoFrete();
  if (aba === 'orcamento') popularSelectsOrcamento();
  render();
}

function parseValor(v) {
  if (!v) return NaN;
  return parseFloat(v.replace(/\./g, '').replace(',', '.'));
}
function formatarMoeda(v) {
  const sinal = v < 0 ? '-' : '';
  return sinal + Math.abs(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}
function formatarData(d) {
  if (!d) return null;
  const [ano, mes, dia] = d.split('-');
  return dia + '/' + mes + '/' + ano;
}

function salvar() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(dados));
  } catch (e) {
    alert('Não foi possível salvar. O navegador pode estar sem espaço ou bloqueando o salvamento local. Tente abrir o arquivo direto no Chrome/Safari.');
  }
  render();
}

/* ---------- criar orçamento ---------- */
let editandoId = null;

formOrcamento.addEventListener('submit', (e) => {
  e.preventDefault();
  erroOrcamento.textContent = '';
  const cliente = document.getElementById('opCliente').value.trim();
  const telefone = document.getElementById('opTelefone').value.trim();
  const endereco = document.getElementById('opEndereco').value.trim();
  const bairro = document.getElementById('opBairro').value.trim();
  const numero = document.getElementById('opNumero').value.trim();
  const referencia = document.getElementById('opReferencia').value.trim();
  const obsMotorista = document.getElementById('opObsMotorista').value.trim();
  const dataEntrega = document.getElementById('opDataEntrega').value || null;
  const pagamento = opPagamento.value;

  const freteSelecionado = dados.fretes.find(f => f.id === opSelectFrete.value);
  const freteValor = parseValor(opFreteValor.value) || 0;

  if (!cliente) { erroOrcamento.textContent = 'Informe o nome do cliente.'; return; }
  if (itensAtuais.length === 0) { erroOrcamento.textContent = 'Adicione pelo menos um produto ao orçamento.'; return; }

  const totalProdutos = totalProdutosAtual();
  const valor = totalProdutos + freteValor;

  let qtdParcelas = null, valorParcela = null, valorComJuros = null;
  if (pagamento === '2x' || pagamento === '3x') {
    qtdParcelas = pagamento === '2x' ? 2 : 3;
    valorParcela = valor / qtdParcelas;
    valorComJuros = valor;
  } else if (pagamento === 'Parcelado com juros') {
    qtdParcelas = parseInt(opQtdParcelasJuros.value);
    if (!qtdParcelas || qtdParcelas < 4) {
      erroOrcamento.textContent = 'Informe a quantidade de parcelas (4 ou mais).';
      return;
    }
    valorComJuros = valor * (1 + 0.02 * qtdParcelas);
    valorParcela = valorComJuros / qtdParcelas;
  }

  const dadosOrcamento = {
    cliente, telefone, endereco, bairro, numero, referencia,
    itens: itensAtuais.slice(),
    totalProdutos,
    freteLocal: freteSelecionado ? freteSelecionado.local : '',
    freteId: freteSelecionado ? freteSelecionado.id : '',
    freteValor,
    freteCusto: freteSelecionado ? (freteSelecionado.custo || 0) : 0,
    periodo: periodoSelecionado,
    obsMotorista,
    valor, dataEntrega, pagamento,
    qtdParcelas, valorParcela, valorComJuros
  };

  if (editandoId) {
    const pedido = dados.pedidos.find(x => x.id === editandoId);
    if (pedido) Object.assign(pedido, dadosOrcamento);
  } else {
    dados.pedidos.unshift({
      id: Date.now().toString(),
      ...dadosOrcamento,
      status: 'orcamento',
      pagamentoRecebido: false,
      comissaoLancada: false,
      criadoEm: new Date().toISOString().slice(0,10)
    });
  }
  salvar();
  sairModoEdicao();
  calcularTotais();
  setAba('orcamento');
});

function editarPedido(id) {
  const p = dados.pedidos.find(x => x.id === id);
  if (!p) return;
  editandoId = id;

  setAba('orcamento');

  document.getElementById('opCliente').value = p.cliente || '';
  document.getElementById('opTelefone').value = p.telefone || '';
  document.getElementById('opEndereco').value = p.endereco || '';
  document.getElementById('opBairro').value = p.bairro || '';
  document.getElementById('opNumero').value = p.numero || '';
  document.getElementById('opReferencia').value = p.referencia || '';
  document.getElementById('opObsMotorista').value = p.obsMotorista || '';
  document.getElementById('opDataEntrega').value = p.dataEntrega || '';
  opPagamento.value = p.pagamento || 'À vista';
  opPagamento.dispatchEvent(new Event('change'));
  if (p.pagamento === 'Parcelado com juros') {
    opQtdParcelasJuros.value = p.qtdParcelas || '';
  }

  periodoSelecionado = p.periodo || null;
  document.getElementById('btnPeriodoManha').classList.toggle('active', periodoSelecionado === 'manha');
  document.getElementById('btnPeriodoTarde').classList.toggle('active', periodoSelecionado === 'tarde');

  itensAtuais = (p.itens || []).slice();
  renderItensAtuais();

  opSelectFrete.value = p.freteId && dados.fretes.some(f => f.id === p.freteId) ? p.freteId : '';
  opFreteValor.value = p.freteValor ? String(p.freteValor).replace('.', ',') : '0';

  calcularTotais();

  document.getElementById('btnSubmitOrcamento').textContent = 'Salvar alterações';
  document.getElementById('btnCancelarEdicao').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function sairModoEdicao() {
  editandoId = null;
  formOrcamento.reset();
  itensAtuais = [];
  renderItensAtuais();
  periodoSelecionado = null;
  document.getElementById('btnPeriodoManha').classList.remove('active');
  document.getElementById('btnPeriodoTarde').classList.remove('active');
  opFreteValor.value = '0';
  opSelectFrete.value = '';
  opParceladoJurosFields.style.display = 'none';
  opParcelaPreview.textContent = '';
  document.getElementById('btnSubmitOrcamento').textContent = 'Criar orçamento';
  document.getElementById('btnCancelarEdicao').style.display = 'none';
}
document.getElementById('btnCancelarEdicao').addEventListener('click', sairModoEdicao);
window.__editarPedido = editarPedido;

/* ---------- ações pedidos ---------- */
const proximoStatus = { orcamento: 'aprovado', aprovado: 'entrega', entrega: 'executado' };
const statusLabel = { orcamento: 'Orçamento', aprovado: 'Aprovado', entrega: 'Em entrega', executado: 'Executado' };
const botaoLabel = { orcamento: 'Aprovar pedido', aprovado: 'Marcar como em entrega', entrega: 'Marcar como executado' };

function avancarPedido(id) {
  const p = dados.pedidos.find(x => x.id === id);
  if (!p) return;
  if (proximoStatus[p.status]) {
    const eraOrcamento = p.status === 'orcamento';
    p.status = proximoStatus[p.status];
    if (eraOrcamento && !p.comissaoLancada) {
      const valorComissao = calcularComissaoPedido(p);
      dados.comissoes.unshift({
        id: Date.now().toString(),
        descricao: 'Comissão — ' + p.cliente,
        valor: valorComissao,
        data: new Date().toISOString().slice(0,10),
        pago: false
      });
      p.comissaoLancada = true;
    }
    salvar();
  }
}

function voltarPedido(id) {
  const p = dados.pedidos.find(x => x.id === id);
  if (!p) return;
  const anterior = { aprovado: 'orcamento', entrega: 'aprovado', executado: 'entrega' };
  if (anterior[p.status]) {
    p.status = anterior[p.status];
    salvar();
  }
}

function removerPedido(id) {
  dados.pedidos = dados.pedidos.filter(x => x.id !== id);
  salvar();
}

function togglePagamentoPedido(id) {
  const p = dados.pedidos.find(x => x.id === id);
  if (!p) return;
  p.pagamentoRecebido = !p.pagamentoRecebido;
  salvar();
}
window.__togglePagamentoPedido = togglePagamentoPedido;

      <div>
        <div class="rc-nome">JP CONSTRUÇÕES</div>
        <div class="rc-slogan">A MELHOR DO BRASIL</div>
      </div>
    </div>
    <div class="rc-titulo">Orçamento</div>
    <div class="rc-linha"><b>Cliente:</b> ${p.cliente}</div>
    ${p.telefone ? `<div class="rc-linha"><b>Telefone:</b> ${p.telefone}</div>` : ''}
    ${p.dataEntrega ? `<div class="rc-linha"><b>📅 Entrega prevista:</b> ${formatarData(p.dataEntrega)}${p.periodo ? ' (' + (p.periodo === 'manha' ? 'manhã' : 'tarde') + ')' : ''}</div>` : ''}
    ${enderecoCompleto ? `<div class="rc-linha"><b>Endereço:</b> ${enderecoCompleto}</div>` : ''}
    ${p.referencia ? `<div class="rc-linha"><b>Referência:</b> ${p.referencia}</div>` : ''}
    ${tabelaItens}
    ${p.freteValor ? `<div class="rc-linha"><b>Frete${p.freteLocal ? ' (' + p.freteLocal + ')' : ''}:</b> ${formatarMoeda(p.freteValor)}</div>` : ''}
    ${p.obsMotorista ? `<div class="rc-linha"><b>Obs. entrega/motorista:</b> ${p.obsMotorista}</div>` : ''}
    <div class="rc-valor-box">
      <div class="rc-linha" style="margin-bottom:2px;">Valor total</div>
      <div class="rc-valor-total">${formatarMoeda(p.valor)}</div>
      <div class="rc-linha" style="margin-top:6px; margin-bottom:0;"><b>Pagamento:</b> ${pagamentoTxt}${badgeParcelado}</div>
    </div>
    <div class="rc-rodape">Gerado em ${new Date().toLocaleDateString('pt-BR')} — JP Construções</div>
  `;

  const template = document.getElementById('reciboTemplate');
  template.innerHTML = html;

  if (typeof html2canvas === 'undefined') {
    alert('Não foi possível gerar a imagem (sem conexão com a internet). Conecte-se e tente novamente.');
    return;
  }

  html2canvas(template, { backgroundColor: '#ffffff', scale: 2 }).then(canvas => {
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const nomeArquivo = 'orcamento-' + p.cliente.replace(/[^a-zA-Z0-9]+/g, '-').toLowerCase() + '.png';

      const a = document.createElement('a');
      a.href = url;
      a.download = nomeArquivo;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      // também abre em nova aba, útil no celular para segurar e "compartilhar/salvar"
      window.open(url, '_blank');
    }, 'image/png');
  }).catch(() => {
    alert('Não foi possível gerar a imagem. Tente novamente.');
  });
}

function removerComissao(id) {
  dados.comissoes = dados.comissoes.filter(x => x.id !== id);
  salvar();
}
function removerPagamento(id) {
  dados.pagamentos = dados.pagamentos.filter(x => x.id !== id);
  salvar();
}
function togglePagoComissao(id) {
  const c = dados.comissoes.find(x => x.id === id);
  if (!c) return;
  c.pago = !c.pago;
  salvar();
}
function togglePagoPagamento(id) {
  const p = dados.pagamentos.find(x => x.id === id);
  if (!p) return;
  p.pago = !p.pago;
  salvar();
}

window.__avancarPedido = avancarPedido;
window.__voltarPedido = voltarPedido;
window.__removerPedido = removerPedido;
window.__imprimirPedido = imprimirPedido;
window.__removerComissao = removerComissao;
window.__removerPagamento = removerPagamento;
window.__toggleComissao = togglePagoComissao;
window.__togglePagamento = togglePagoPagamento;

/* ---------- backup ---------- */
function exportarBackup() {
  const blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const hoje = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = 'backup-jp-construcoes-' + hoje + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  mostrarBackupMsg('Backup baixado. Envie esse arquivo para o outro aparelho e importe lá.', false);
}
function mostrarBackupMsg(msg, erro) {
  const el = document.getElementById('backupMsg');
  el.textContent = msg;
  el.className = 'backup-msg' + (erro ? ' erro' : '');
}
document.getElementById('btnExportar').addEventListener('click', exportarBackup);
document.getElementById('inputImportar').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const novosDados = JSON.parse(ev.target.result);
      if (!novosDados || !Array.isArray(novosDados.pedidos)) throw new Error('formato inválido');
      const substituir = (dados.pedidos.length === 0 && dados.comissoes.length === 0 && dados.pagamentos.length === 0) ||
        confirm('Isso vai substituir os dados salvos neste aparelho pelos dados do arquivo importado. Continuar?');
      if (!substituir) { mostrarBackupMsg('Importação cancelada.', false); return; }
      dados = novosDados;
      salvar();
      mostrarBackupMsg('Dados importados com sucesso!', false);
    } catch (err) {
      mostrarBackupMsg('Não foi possível importar esse arquivo. Verifique se é um backup válido.', true);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* ---------- render ---------- */
function render() {
  const pedidos = dados.pedidos;
  const orcamentos = pedidos.filter(p => p.status === 'orcamento');
  const aprovados = pedidos.filter(p => p.status === 'aprovado');
  const entregas = pedidos.filter(p => p.status === 'entrega');
  const executados = pedidos.filter(p => p.status === 'executado');

  document.getElementById('resOrcamentos').textContent = orcamentos.length;
  document.getElementById('resAndamento').textContent = aprovados.length + entregas.length;

  const comissaoPendente = dados.comissoes.filter(c => !c.pago).reduce((a,c) => a + c.valor, 0);
  document.getElementById('resComissao').textContent = formatarMoeda(comissaoPendente);

  const hoje = new Date();
  const pagamentosMes = dados.pagamentos.filter(p => {
    if (p.pago || !p.vencimento) return false;
    const d = new Date(p.vencimento + 'T00:00:00');
    return d.getMonth() === hoje.getMonth() && d.getFullYear() === hoje.getFullYear();
  }).reduce((a,p) => a + p.valor, 0);
  document.getElementById('resPagamentos').textContent = formatarMoeda(pagamentosMes);

  const lista = document.getElementById('lista');
  lista.innerHTML = '';

  function renderPedidoCard(p) {
    const div = document.createElement('div');
    div.className = 'pedido-card';
    const botao = botaoLabel[p.status]
      ? `<button class="btn-avancar" onclick="window.__avancarPedido('${p.id}')">${botaoLabel[p.status]}</button>`
      : '';
    const voltar = p.status !== 'orcamento'
      ? `<button class="btn-voltar" onclick="window.__voltarPedido('${p.id}')">Voltar etapa</button>`
      : '';
    const imprimir = `<button class="btn-imprimir" onclick="window.__imprimirPedido('${p.id}')">🖨️ Salvar / imprimir</button>`;
    const editar = `<button class="btn-voltar" onclick="window.__editarPedido('${p.id}')">✏️ Editar</button>`;
    const bannerPagamento = p.status === 'executado'
      ? (p.pagamentoRecebido
          ? `<div class="pedido-pago-banner">✅ Pagamento recebido <button onclick="window.__togglePagamentoPedido('${p.id}')">Desfazer</button></div>`
          : `<div class="pedido-pendente-banner">⚠️ Pagamento pendente <button onclick="window.__togglePagamentoPedido('${p.id}')">Marcar como pago</button></div>`)
      : '';
    div.innerHTML = `
      ${bannerPagamento}
      <div class="pedido-top">
        <div>
          <div class="pedido-cliente">${p.cliente}</div>
          <span class="badge ${p.status}">${statusLabel[p.status]}</span>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <div class="pedido-valor">${formatarMoeda(p.valor)}</div>
          <button class="del-btn" onclick="window.__removerPedido('${p.id}')" title="Remover">✕</button>
        </div>
      </div>
      <div class="pedido-info">
        ${p.telefone ? `<div><b>Telefone:</b> ${p.telefone}</div>` : ''}
        ${p.endereco ? `<div><b>Endereço:</b> ${p.endereco}${p.numero ? ', nº ' + p.numero : ''}${p.bairro ? ' — ' + p.bairro : ''}</div>` : ''}
        ${p.referencia ? `<div><b>Referência:</b> ${p.referencia}</div>` : ''}
        ${p.itens && p.itens.length ? `<div><b>Produtos:</b> ${p.itens.map(it => it.nome + ' (' + it.quantidade + 'x ' + formatarMoeda(it.precoUnitario) + ')').join(', ')}</div>` : ''}
        ${p.freteValor ? `<div><b>Frete:</b> ${p.freteLocal ? p.freteLocal + ' — ' : ''}${formatarMoeda(p.freteValor)}</div>` : ''}
        ${p.dataEntrega ? `<div><b>Entrega prevista:</b> ${formatarData(p.dataEntrega)}${p.periodo ? ' (' + (p.periodo === 'manha' ? 'manhã' : 'tarde') + ')' : ''}</div>` : ''}
        ${p.pagamento ? `<div><b>Pagamento:</b> ${p.pagamento}${p.qtdParcelas ? ' — ' + p.qtdParcelas + 'x de ' + formatarMoeda(p.valorParcela) : ''}${p.pagamento === 'Parcelado com juros' ? ' (total c/ juros: ' + formatarMoeda(p.valorComJuros) + ')' : ''}</div>` : ''}
        ${p.obsMotorista ? `<div><b>Obs. motorista:</b> ${p.obsMotorista}</div>` : ''}
        ${p.status !== 'orcamento' ? `<div style="color:#2f9e52; font-weight:700;">💰 Sua comissão: ${formatarMoeda(calcularComissaoPedido(p))}</div>` : ''}
      </div>
      <div class="pedido-actions">${botao}${voltar}${editar}${imprimir}</div>
    `;
    lista.appendChild(div);
  }

  if (abaAtual === 'orcamento') {
    if (orcamentos.length === 0) { lista.innerHTML = '<div class="empty">Nenhum orçamento criado ainda.</div>'; return; }
    orcamentos.forEach(renderPedidoCard);
    return;
  }
  if (abaAtual === 'aprovado') {
    if (aprovados.length === 0) { lista.innerHTML = '<div class="empty">Nenhum pedido aprovado no momento.</div>'; return; }
    aprovados.forEach(renderPedidoCard);
    return;
  }
  if (abaAtual === 'entrega') {
    if (entregas.length === 0) { lista.innerHTML = '<div class="empty">Nenhum pedido em entrega no momento.</div>'; return; }
    entregas.forEach(renderPedidoCard);
    return;
  }
  if (abaAtual === 'executado') {
    if (executados.length === 0) { lista.innerHTML = '<div class="empty">Nenhum pedido executado ainda.</div>'; return; }
    executados.forEach(renderPedidoCard);
    return;
  }

  if (abaAtual === 'comissao') {
    if (dados.comissoes.length === 0) { lista.innerHTML = '<div class="empty">Nenhuma comissão registrada ainda.</div>'; return; }
    const totalPendente = dados.comissoes.filter(c => !c.pago).reduce((a,c) => a + c.valor, 0);
    const totalRecebida = dados.comissoes.filter(c => c.pago).reduce((a,c) => a + c.valor, 0);
    const resumo = document.createElement('div');
    resumo.className = 'total-box';
    resumo.style.marginBottom = '12px';
    resumo.innerHTML = `
      <div>A receber: <b>${formatarMoeda(totalPendente)}</b></div>
      <div>Já recebida: <b>${formatarMoeda(totalRecebida)}</b></div>
      <div class="total-geral">Total geral: <span>${formatarMoeda(totalPendente + totalRecebida)}</span></div>
    `;
    lista.appendChild(resumo);
    dados.comissoes.forEach(c => {
      const div = document.createElement('div');
      div.className = 'fin-item' + (c.pago ? ' pago' : '');
      div.innerHTML = `
        <div class="checkbox ${c.pago ? 'checked' : ''}" onclick="window.__toggleComissao('${c.id}')">✓</div>
        <div class="fin-body">
          <div class="fin-title ${c.pago ? 'strike' : ''}">${c.descricao}</div>
          <div class="fin-meta">${formatarMoeda(c.valor)}${c.data ? ' · ' + formatarData(c.data) : ''}${c.pago ? ' · Recebida' : ' · Pendente'}</div>
        </div>
        <button class="del-btn" onclick="window.__removerComissao('${c.id}')" title="Remover">✕</button>
      `;
      lista.appendChild(div);
    });
    return;
  }

  if (abaAtual === 'produtos') {
    if (dados.produtos.length === 0) { lista.innerHTML = '<div class="empty">Nenhum produto cadastrado ainda.</div>'; return; }
    dados.produtos.forEach(p => {
      const div = document.createElement('div');
      div.className = 'fin-item';
      const lucroUnit = p.precoUnitario - (p.precoCusto || 0);
      div.innerHTML = `
        <div class="fin-body">
          <div class="fin-title">${p.nome}</div>
          <div class="fin-meta">Venda: ${formatarMoeda(p.precoUnitario)} • Custo: ${formatarMoeda(p.precoCusto || 0)} • Lucro: ${formatarMoeda(lucroUnit)} / un.</div>
        </div>
        <button class="btn-voltar" style="padding:6px 10px;" onclick="window.__editarProduto('${p.id}')">✏️</button>
        <button class="del-btn" onclick="window.__removerProduto('${p.id}')" title="Remover">✕</button>
      `;
      lista.appendChild(div);
    });
    return;
  }

  if (abaAtual === 'frete') {
    if (dados.fretes.length === 0) { lista.innerHTML = '<div class="empty">Nenhuma opção de frete cadastrada ainda.</div>'; return; }
    dados.fretes.forEach(f => {
      const div = document.createElement('div');
      div.className = 'fin-item';
      const lucroFrete = f.valor - (f.custo || 0);
      div.innerHTML = `
        <div class="fin-body">
          <div class="fin-title">${f.local}</div>
          <div class="fin-meta">Cobrado: ${formatarMoeda(f.valor)} • Custo: ${formatarMoeda(f.custo || 0)} • Lucro: ${formatarMoeda(lucroFrete)}</div>
        </div>
        <button class="btn-voltar" style="padding:6px 10px;" onclick="window.__editarFrete('${f.id}')">✏️</button>
        <button class="del-btn" onclick="window.__removerFrete('${f.id}')" title="Remover">✕</button>
      `;
      lista.appendChild(div);
    });
    return;
  }

  if (abaAtual === 'pagamento') {
    if (dados.pagamentos.length === 0) { lista.innerHTML = '<div class="empty">Nenhum gasto de marketing registrado ainda.</div>'; return; }
    const ordenados = [...dados.pagamentos].sort((a,b) => {
      if (a.pago !== b.pago) return a.pago ? 1 : -1;
      return (a.vencimento || '').localeCompare(b.vencimento || '');
    });
    ordenados.forEach(p => {
      const div = document.createElement('div');
      div.className = 'fin-item' + (p.pago ? ' pago' : '');
      div.innerHTML = `
        <div class="checkbox ${p.pago ? 'checked' : ''}" onclick="window.__togglePagamento('${p.id}')">✓</div>
        <div class="fin-body">
          <div class="fin-title ${p.pago ? 'strike' : ''}">${p.descricao}</div>
          <div class="fin-meta">${formatarMoeda(p.valor)}${p.vencimento ? ' · Vence: ' + formatarData(p.vencimento) : ''}${p.pago ? ' · Pago' : ' · Pendente'}</div>
        </div>
        <button class="del-btn" onclick="window.__removerPagamento('${p.id}')" title="Remover">✕</button>
      `;
      lista.appendChild(div);
    });
    return;
  }
}

popularSelectsOrcamento();
setAba('orcamento');
render();
</script>
